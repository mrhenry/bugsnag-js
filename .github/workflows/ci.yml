name: CI

# Runs every test that can run on GitHub-hosted runners for all packages:
# linting, unit tests, type tests and the native (C/C++) lint.
#
# Deliberately *excluded* (see the comment at the bottom of this file for why):
#   - the Maze Runner end-to-end suites (browser, node, react-native,
#     react-native-cli, cloudflare-workers, expo and Electron integration)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
          cache: npm
      - run: npm ci --no-audit --progress=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:types
