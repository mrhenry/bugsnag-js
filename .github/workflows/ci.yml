name: CI

# Runs every test that can run on GitHub-hosted runners for all packages:
# linting, unit tests, type tests and the native (C/C++) lint.
#
# Deliberately *excluded* (see the comment at the bottom of this file for why):
#   - the Maze Runner end-to-end suites (browser, node, react-native,
#     react-native-cli, cloudflare-workers, expo and Electron integration)

on:
  push:
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint over every package, including TypeScript-aware rules.
  lint:
    name: Lint (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --progress=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:lint

  # Jest unit tests for every package. `xvfb-maybe` transparently starts a
  # virtual display when one is available and falls back to a plain run
  # otherwise, so no extra setup is required on the runner.
  unit:
    name: Unit tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --progress=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:unit

  # Compiles the repo's .d.ts files and runs each package's `test:types` script.
  # A build is required first because a few packages (e.g. @bugsnag/plugin-angular)
  # generate their type declarations as part of their build step.
  types:
    name: Type tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --progress=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
      - run: npm run test:types

  # Static analysis of the C/C++ native extensions bundled with the Electron
  # packages. cppcheck consumes the compile_commands.json files generated by
  # node-gyp, so the build tools are installed on the runner.
  native-lint:
    name: Lint (C/C++ extensions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get --assume-yes update
          sudo apt-get --assume-yes install cppcheck build-essential
      - run: npm ci --no-audit --progress=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:lint-native

# ---------------------------------------------------------------------------
# Excluded tests
# ---------------------------------------------------------------------------
# The following suites are intentionally not run here because they cannot run
# on GitHub-hosted runners:
#
# * test:node (`npm run test:node`) and the browser/react-native/react-native-cli
#   Maze Runner suites — these are containerised and pull the `*-maze-runner`
#   images from Bugsnag's private AWS ECR registry. They need the
#   `test:test-container-registry-login` AWS credentials and the private
#   BrowserStack/BitBar accounts used by the `@browser`/`@bitbar` steps. Only
#   Bugsnag employees can run them (see TESTING.md).
# * test/react-native (Android/iOS pipelines) — these require Xcode, the Android
#   SDK and hardware/emulator devices plus the same private credentials, none of
#   which are available on hosted runners.
# * test/cloudflare-workers and the expo suite — driven by Bugsnag's self-hosted
#   runners and a separate `bugsnag-expo` build; they are not runnable on
#   GitHub-hosted runners.
# * Electron integration tests (`npm run test:electron`) and the Electron
#   main/renderer runner unit tests — these are covered by the dedicated
#   `.github/workflows/test-electron.yml`, which packages the app and exercises
#   it against several Electron versions.
#
# The AWS Lambda Maze Runner suite is covered separately by
# `.github/workflows/aws-lambda.yml`.
